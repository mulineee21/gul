name: 💡 Feature Request or Proposal
description: Suggest an idea or enhancement for GUL (Universal Linux Manager).
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We would love to hear your ideas to make GUL the best universal software center on Linux!
  - type: textarea
    id: idea
    attributes:
      label: What feature would you like to see added?
      description: Describe in detail how it should work and what problem it solves.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Alternatives or Additional Context
      description: Are there existing tools that do something similar, or design mockups?
