name: 🐛 Bug Report
description: Create a report to help us improve and fix issues in GUL.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this issue!
  - type: input
    id: distro
    attributes:
      label: Linux Distribution
      description: Which Linux distribution and package manager are you using?
      placeholder: e.g. Arch / CachyOS (Pacman), Ubuntu 24.04 (APT), Fedora 40 (DNF), Gentoo (Portage)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise explanation of what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the problem.
      value: |
        1. Open '...'
        2. Click on '....'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs or Screenshots (Optional)
      description: Paste any error messages or relevant logs here.
